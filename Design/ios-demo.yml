name: SkynetIOSDemo
options:
  deploymentTarget:
    iOS: "18.0"
packages:
  SkynetCore:
    path: ../Packages/SkynetCore
targets:
  SkynetIOSDemo:
    type: application
    platform: iOS
    sources:
      - path: ../Apps/iOS/Skynet
        excludes:
          - App/SkynetApp.swift
      - path: ../Design
        includes:
          - iOSReadmeDemo.swift
    dependencies:
      - package: SkynetCore
        product: SkynetMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skynetresearch.readme-ios-demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  SkynetIOSDemo:
    build:
      targets:
        SkynetIOSDemo: all
