name: Skynet
options:
  bundleIdPrefix: com.skynetresearch
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
packages:
  SkynetCore:
    path: Packages/SkynetCore
targets:
  SkynetPTYLauncher:
    type: tool
    platform: macOS
    sources:
      - Apps/macOS/SkynetPTYLauncher
  SkynetMac:
    type: application
    platform: macOS
    sources:
      - Apps/macOS/Skynet
    dependencies:
      - target: SkynetPTYLauncher
        link: false
        embed: false
      - package: SkynetCore
        product: SkynetCore
      - package: SkynetCore
        product: SkynetMobile
    postBuildScripts:
      - name: Bundle terminal launcher
        script: |
          set -eu
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp "${BUILT_PRODUCTS_DIR}/SkynetPTYLauncher" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/SkynetPTYLauncher"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/SkynetPTYLauncher
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/SkynetPTYLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skynetresearch.skynet.mac
        PRODUCT_NAME: Skynet
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Skynet shares selected projects with your paired iPhone or iPad."
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
  Skynet:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/Skynet
    dependencies:
      - package: SkynetCore
        product: SkynetMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skynetresearch.skynet.ios
        PRODUCT_NAME: Skynet
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Skynet uses the camera to scan pairing codes and attach images."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Skynet connects to your paired Mac to sync sessions and send prompts."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  SkynetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Apps/iOS/Tests
    dependencies:
      - target: Skynet
      - package: SkynetCore
        product: SkynetMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skynetresearch.skynet.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
schemes:
  SkynetMac:
    build:
      targets:
        SkynetMac: all
    run:
      config: Debug
  Skynet:
    build:
      targets:
        Skynet: all
        SkynetTests: [test]
    test:
      targets:
        - SkynetTests
